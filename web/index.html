<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Trash Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
<script src="web/app.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }

    /* карта занимает весь экран, панель лежит сверху поверх карты */
    #map { height: 100vh; width: 100vw; }

    .panel {
      position: absolute;
      z-index: 9999;
      left: 12px;
      right: 12px;
      bottom: 12px;
      background: rgba(255,255,255,0.95);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .row { display: flex; gap: 8px; align-items: center; }
    .row + .row { margin-top: 8px; }

    input, button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-primary { background: #1f6feb; color: #fff; }
    .btn-secondary { background: #f1f3f5; }

    .small { font-size: 12px; opacity: 0.85; }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="panel">
    <div class="row">
      <input id="note" placeholder="Комментарий (например: «постоянно мусор у остановки»)" />
    </div>
    <div class="row">
      <button class="btn-primary" id="btnMark">📍 Отметить здесь</button>
      <button class="btn-secondary" id="btnMyLoc">🎯 Моё местоположение</button>
    </div>
    <div class="row">
      <div class="small" id="status">Готово.</div>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script src="app.js"></script>
</body>
</html>
